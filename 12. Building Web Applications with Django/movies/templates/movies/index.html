{% extends 'base.html' %}

{% block title %}Movies{% endblock %}

{% block content %}
    <!-- <h1>Movies</h1> -->
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Title</th>
                <th>Genre</th>
                <th>Release Year</th>
                <th>Stock</th>
                <th>Daily Rate</th>
            </tr>
        </thead>
        <tbody>
            {% for movie in movies %}
                <tr>
                    <td><a href="{% url 'movies:details' movie.id %}">{{ movie.title }}</a></td>
                    <td>{{ movie.genre }}</td>
                    <td>{{ movie.release_year }}</td>
                    <td>{{ movie.number_in_stock }}</td>
                    <td>{{ movie.daily_rate }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
